apiVersion: 1

apps:
  - type: consensys-asko11y-app
    org_id: 1
    jsonData:
      useBuiltInMCP: true
      mcpServers:
        - id: graphiti
          name: Graphiti Knowledge Graph
          url: 'http://graphiti:8000/mcp'
          enabled: true
          type: 'streamable-http'
          headers:
            Host: 'localhost:8000'
    secureJsonData:
      redisURL: 'redis://redis:6379/0'
