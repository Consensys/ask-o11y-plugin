# CI: version is bumped by release-please on release; branch/PR builds stay at the
# last published semver, so the catalog "must be newer" rule does not apply here.
# See https://github.com/grafana/plugin-validator#using-a-configuration-file
global:
  enabled: true
  jsonOutput: false
  reportAll: false

analyzers:
  version:
    enabled: false
  # The validator bundles a govulncheck built with Go 1.24.2. It refuses to
  # analyze a module that requires Go 1.26.10 ("this validator supports Go
  # 1.24.2"), which would fail every run. CI runs govulncheck directly on the
  # pinned Go 1.26.10 toolchain instead (see the govulncheck step in ci.yml and
  # release.yml), which covers the same rule with a supported toolchain.
  govulncheck:
    enabled: false
